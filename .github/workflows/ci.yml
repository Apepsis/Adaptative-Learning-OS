name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: learning_os
          POSTGRES_USER: learning
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U learning -d learning_os"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: change-me-too
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://learning:test-password@localhost:5432/learning_os
      REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: change-me-too
      S3_BUCKET_ORIGINALS: originals
      S3_BUCKET_PREVIEWS: previews
      LOCAL_SINGLE_USER: "true"
      LOCAL_SINGLE_USER_EMAIL: ci@example.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install Python dependencies
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Ruff
        working-directory: apps/api
        run: ruff check .

      - name: Mypy
        working-directory: apps/api
        run: mypy app

      - name: Apply migrations
        working-directory: apps/api
        run: alembic upgrade head

      - name: Check for model/migration drift
        working-directory: apps/api
        run: alembic check

      - name: Pytest
        working-directory: apps/api
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/package.json

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install

      - name: Lint
        working-directory: apps/web
        run: pnpm lint

      - name: Typecheck
        working-directory: apps/web
        run: pnpm typecheck

      - name: Unit tests
        working-directory: apps/web
        run: pnpm test -- --run

      - name: Build
        working-directory: apps/web
        run: pnpm build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build api image
        run: docker build -f infra/docker/api.Dockerfile -t adaptive-learning-os-api:ci .

      - name: Build web image
        run: docker build -f infra/docker/web.Dockerfile -t adaptive-learning-os-web:ci .
