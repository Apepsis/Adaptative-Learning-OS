[tool.ruff]
line-length = 100
target-version = "py313"
src = ["apps/api/app"]
extend-exclude = ["apps/api/app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
mypy_path = "apps/api"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["apps/api/app/db/migrations/versions"]
