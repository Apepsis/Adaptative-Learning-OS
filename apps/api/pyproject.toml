[project]
name = "adaptive-learning-api"
version = "0.1.0"
description = "Adaptive Learning OS backend (modular monolith)"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.14",
  "celery[redis]>=5.4",
  "redis>=5.2",
  "boto3>=1.35",
  "python-magic>=0.4.27",
  "httpx>=0.27",
  "structlog>=24.4",
  "python-multipart>=0.0.12",
  "pypdf>=5.1",
  "pgvector>=0.3.6",
  "sentence-transformers>=3.2",
  "google-genai>=1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.7",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
markers = [
  "slow: exercises the real embedding model and/or a real parsed PDF; not run by default (see `make test-slow`).",
]
addopts = "-m 'not slow'"
